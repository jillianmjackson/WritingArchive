  <link rel="icon" type="image/svg+xml" href="assets/img/favicon-light.svg">
  <script>
    // Apply dark mode before first paint so pages don't flash light.
    try {
      if (localStorage.getItem('lamp-switched') === 'true') {
        document.documentElement.dataset.theme = 'dark';
        const icon = document.querySelector('link[rel="icon"]');
        icon.href = icon.href.replace('favicon-light', 'favicon-dark');
      }
    } catch (_) {}
  </script>
  <script src="assets/js/lamp.js" defer></script>
</head>

    <div class="rail">
    <header class="masthead">

      </button>
      <p class="site-name">Jillian’s Writing Archive</p>
      <nav class="tabs" aria-label="Categories">
